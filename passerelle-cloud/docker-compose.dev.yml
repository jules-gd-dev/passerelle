version: '3.8'

services:
  api:
    image: node:20-alpine
    user: node
    working_dir: /app/api
    volumes:
      - ./api:/app/api
    command: sh -c "npm install && npx tsx watch src/index.ts"

  web:
    image: node:20-alpine
    user: node
    working_dir: /app/web
    volumes:
      - ./web:/app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    environment:
      - TUNNEL_UUID=${TUNNEL_UUID:?TUNNEL_UUID must be set. See .env.example}
      - TUNNEL_HOSTNAME=${TUNNEL_HOSTNAME:?TUNNEL_HOSTNAME must be set. See .env.example}
    volumes:
      - ${TUNNEL_CREDENTIALS_PATH:?TUNNEL_CREDENTIALS_PATH must be set. See .env.example}:/etc/cloudflared/${TUNNEL_UUID:?TUNNEL_UUID must be set}.json:ro
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - api
      - web
